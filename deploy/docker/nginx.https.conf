map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

include /etc/nginx/cloudflare-real-ip.inc;

log_format sym_security '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                        'host="$host" ua="$http_user_agent"';
access_log /var/log/nginx/security.log sym_security;

limit_req_zone $binary_remote_addr zone=sym_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sym_track:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sym_public:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=sym_admin:10m rate=180r/m;
limit_conn_zone $binary_remote_addr zone=sym_connections:10m;
limit_req_status 429;
limit_conn_status 429;

server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}

server {
    listen 80;
    server_name symluxlib.com www.symluxlib.com admin.symluxlib.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~* (^|/)(?:\.[^/]+|Dockerfile$|docker-compose(?:\.[^/]*)?\.ya?ml$|master\.key|appsettings|config\.inc\.php|index\.php|_ignition|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma)(?:/|$)|\.(?:sql|dump|zip|bak|old|backup|copy|log|ini|conf)(?:\.[^/]*)?$ { return 404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name api.symluxlib.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 421;
}

server {
    listen 443 ssl;
    server_name www.symluxlib.com;
    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://symluxlib.com$request_uri;
}

server {
    listen 443 ssl;
    server_name symluxlib.com;
    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    limit_conn sym_connections 20;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' https: data:; media-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:" always;

    location ~* (^|/)(?:\.[^/]+|Dockerfile$|docker-compose(?:\.[^/]*)?\.ya?ml$|master\.key|appsettings|config\.inc\.php|index\.php|_ignition|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma)(?:/|$)|\.(?:sql|dump|zip|bak|old|backup|copy|log|ini|conf)(?:\.[^/]*)?$ { return 404; }
    location ^~ /admin/ { return 404; }

    location ~ ^/api/v1/base/(contacts|banners|site-config|home-layout|categories)$ {
        limit_except GET { deny all; }
        limit_req zone=sym_public burst=60 nodelay;
        proxy_pass http://api:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/api/v1/base/catalog(?:/|$) {
        limit_except GET { deny all; }
        limit_req zone=sym_public burst=60 nodelay;
        proxy_pass http://api:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /api/v1/base/track/ {
        limit_except POST { deny all; }
        limit_req zone=sym_track burst=10 nodelay;
        proxy_pass http://api:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ { return 404; }
    location ^~ /assets/ {
        root /usr/share/nginx/html/official;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        root /usr/share/nginx/html/official;
        add_header Cache-Control no-cache;
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name admin.symluxlib.com;
    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 10m;
    limit_conn sym_connections 20;
    auth_basic "SYM Admin";
    auth_basic_user_file /etc/nginx/admin.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' https: data:; media-src 'self' https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" always;

    location ~* (^|/)(?:\.[^/]+|Dockerfile$|docker-compose(?:\.[^/]*)?\.ya?ml$|master\.key|appsettings|config\.inc\.php|index\.php|_ignition|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma)(?:/|$)|\.(?:sql|dump|zip|bak|old|backup|copy|log|ini|conf)(?:\.[^/]*)?$ { return 404; }
    location ^~ /api/v1/product/import/ { return 404; }
    location = /api/v1/base/access_token {
        client_max_body_size 1m;
        limit_req zone=sym_login burst=5 nodelay;
        proxy_pass http://api:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/api/v1/product/media/(?:video|upload-video) {
        client_max_body_size 250m;
        limit_req zone=sym_admin burst=90 nodelay;
        proxy_pass http://api:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ ^/api/v1/(?:product/media|site-config|home-layout) {
        client_max_body_size 20m;
        limit_req zone=sym_admin burst=90 nodelay;
        proxy_pass http://api:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /api/ {
        limit_req zone=sym_admin burst=90 nodelay;
        proxy_pass http://api:9999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ^~ /assets/ {
        root /usr/share/nginx/html/admin;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        root /usr/share/nginx/html/admin;
        add_header Cache-Control no-cache;
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.symluxlib.com;
    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 404;
}
