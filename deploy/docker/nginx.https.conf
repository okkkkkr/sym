map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name www.symluxlib.com symluxlib.com admin.symluxlib.com api.symluxlib.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.symluxlib.com;

    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;

    location / {
        return 301 https://symluxlib.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name symluxlib.com;
    client_max_body_size 2048m;

    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;

    location ^~ /admin/ {
        return 404;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html/official;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html/official;
        index index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name admin.symluxlib.com;
    client_max_body_size 2048m;

    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;

    location ^~ /assets/ {
        root /usr/share/nginx/html/admin;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html/admin;
        index index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.symluxlib.com;
    client_max_body_size 2048m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;

    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
