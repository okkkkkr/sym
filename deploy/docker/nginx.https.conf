map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

limit_req_zone $binary_remote_addr zone=sym_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sym_track:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sym_public:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=sym_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=sym_admin:10m rate=60r/m;
limit_req_status 429;

server {
    listen 80;
    server_name www.symluxlib.com symluxlib.com admin.symluxlib.com api.symluxlib.com;

    if ($request_method ~ ^(TRACE|CONNECT)$) {
        return 444;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.symluxlib.com;

    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;

    if ($request_method ~ ^(TRACE|CONNECT)$) {
        return 444;
    }

    location / {
        return 301 https://symluxlib.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name symluxlib.com;
    client_max_body_size 2048m;

    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;

    if ($request_method ~ ^(TRACE|CONNECT)$) {
        return 444;
    }

    location ~* (^/(?:\.env|\.git|\.svn|\.hg)(?:/|$)|^/(?:wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma|vendor|config)(?:/|$)|\.(?:php|sql|bak|old|backup|ini|log|conf|env)$) {
        return 444;
    }

    location ^~ /admin/ {
        return 404;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html/official;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html/official;
        index index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name admin.symluxlib.com;
    client_max_body_size 2048m;

    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;

    if ($request_method ~ ^(TRACE|CONNECT)$) {
        return 444;
    }

    location ~* (^/(?:\.env|\.git|\.svn|\.hg)(?:/|$)|^/(?:wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma|vendor|config)(?:/|$)|\.(?:php|sql|bak|old|backup|ini|log|conf|env)$) {
        return 444;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html/admin;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        limit_req zone=sym_admin burst=60 nodelay;
        root /usr/share/nginx/html/admin;
        index index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.symluxlib.com;
    client_max_body_size 2048m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/symluxlib.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/symluxlib.com/privkey.pem;

    if ($request_method ~ ^(TRACE|CONNECT)$) {
        return 444;
    }

    location ~* (^/(?:\.env|\.git|\.svn|\.hg)(?:/|$)|^/(?:wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma|vendor|config)(?:/|$)|\.(?:php|sql|bak|old|backup|ini|log|conf|env)$) {
        return 444;
    }

    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /openapi.json {
        return 404;
    }

    location = /docs {
        return 404;
    }

    location ^~ /docs/ {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    location = /api/v1/base/access_token {
        limit_req zone=sym_login burst=10 nodelay;
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/v1/base/(contacts|banners|site-config|home-layout|categories)$ {
        limit_req zone=sym_public burst=60 nodelay;
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/v1/base/catalog(?:/|$) {
        limit_req zone=sym_public burst=60 nodelay;
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/v1/base/track/ {
        limit_req zone=sym_track burst=30 nodelay;
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        limit_req zone=sym_api burst=100 nodelay;
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
