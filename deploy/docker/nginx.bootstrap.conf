include /etc/nginx/cloudflare-real-ip.inc;
log_format sym_security '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent host="$host"';
access_log /var/log/nginx/security.log sym_security;
server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}

server {
    listen 80;
    server_name symluxlib.com www.symluxlib.com admin.symluxlib.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~* (^|/)(?:\.[^/]+|Dockerfile$|docker-compose(?:\.[^/]*)?\.ya?ml$|master\.key|appsettings|config\.inc\.php|index\.php|_ignition|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma)(?:/|$)|\.(?:sql|dump|zip|bak|old|backup|copy|log|ini|conf)(?:\.[^/]*)?$ { return 404; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name api.symluxlib.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
