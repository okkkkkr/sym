limit_req_zone $binary_remote_addr zone=sym_local:10m rate=500r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 2048m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    limit_req zone=sym_local burst=500 nodelay;

    if ($request_method ~ ^(TRACE|CONNECT)$) {
        return 444;
    }

    location ~* (^/(?:\.env|\.git|\.svn|\.hg)(?:/|$)|^/(?:wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma|vendor|config)(?:/|$)|\.(?:php|sql|bak|old|backup|ini|log|conf|env)$) {
        return 444;
    }

    location ^~ /assets/ {
        root /usr/share/nginx/html/official;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /openapi.json {
        return 404;
    }

    location = /docs {
        return 404;
    }

    location ^~ /docs/ {
        return 404;
    }

    location = /redoc {
        return 404;
    }

    location / {
        root /usr/share/nginx/html/official;
        index index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /admin/index.html;
    }

    location = /api/v1/base/access_token {
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/base/(contacts|banners|site-config|home-layout|categories)$ {
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/base/catalog(?:/|$) {
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/base/track/ {
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/product/import/upload- {
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        set $api_upstream http://api:9999;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
