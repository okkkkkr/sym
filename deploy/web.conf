limit_req_zone $binary_remote_addr zone=sym_login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sym_track:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=sym_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=sym_admin:10m rate=60r/m;

server {
        listen 80;
        server_name localhost; 
        client_max_body_size 2048m;
        if ($request_method ~ ^(TRACE|CONNECT)$) {
                return 444;
        }
        location ~* (^/(?:\.env|\.git|\.svn|\.hg)(?:/|$)|^/(?:wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|pma|vendor|config)(?:/|$)|\.(?:php|sql|bak|old|backup|ini|log|conf|env)$) {
                return 444;
        }
        location ^~ /assets/ {
                root /opt/sym/official-web/dist;
                expires 365d;
                add_header Cache-Control "public, max-age=31536000, immutable";
                try_files $uri =404;
        }
        location ^~ /admin/assets/ {
                alias /opt/sym/web/dist/assets/;
                expires 365d;
                add_header Cache-Control "public, max-age=31536000, immutable";
                try_files $uri =404;
        }
        location ^~ /uploads/ {
                alias /opt/sym/uploads/;
                expires 365d;
                add_header Cache-Control "public, max-age=31536000, immutable";
                try_files $uri =404;
        }
        location / {
                  root /opt/sym/official-web/dist;
                  index index.html index.htm;
                  add_header Cache-Control "no-cache";
                  try_files $uri /index.html;
          }
          location /admin/ {
                  limit_req zone=sym_admin burst=60 nodelay;
                  alias /opt/sym/web/dist/;
              index index.html index.htm;
                  add_header Cache-Control "no-cache";
                  try_files $uri $uri/ /admin/index.html;
        }
        location = /api/v1/base/access_token {
                limit_req zone=sym_login burst=10 nodelay;
                proxy_pass http://127.0.0.1:9999;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/v1/base/track/ {
                limit_req zone=sym_track burst=30 nodelay;
                proxy_pass http://127.0.0.1:9999;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
        }
        location ^~ /api/ {
                limit_req zone=sym_api burst=100 nodelay;
                proxy_pass http://127.0.0.1:9999;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
        }

}
