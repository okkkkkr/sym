services:
  postgres:
    image: postgres:16.14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sym}
      POSTGRES_USER: ${POSTGRES_USER:-sym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sym} -d ${POSTGRES_DB:-sym}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 200

  redis:
    image: redis:7.4.9-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 100

  api:
    build:
      context: .
      target: app_runtime
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      ENVIRONMENT: production
      PRODUCT_IMPORT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/opt/sym/uploads
      - tmp_data:/opt/sym/tmp
    expose:
      - "9999"
    networks: [frontend, backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 768m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9999/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      target: app_runtime
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      ENVIRONMENT: production
      PRODUCT_IMPORT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes:
      - uploads_data:/opt/sym/uploads
      - tmp_data:/opt/sym/tmp
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 200
    mem_limit: 1536m
    cpus: 1.25

  beat:
    build:
      context: .
      target: app_runtime
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      ENVIRONMENT: production
      PRODUCT_IMPORT_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
        "--pidfile=/tmp/celerybeat.pid",
        "--schedule=/tmp/celerybeat-schedule"
      ]
    volumes:
      - uploads_data:/opt/sym/uploads
      - tmp_data:/opt/sym/tmp
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 192m
    cpus: 0.15

  nginx:
    build:
      context: .
      target: nginx_runtime
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - uploads_data:/usr/share/nginx/uploads:ro
      - ./deploy/docker/${NGINX_DEFAULT_CONF_FILE:-nginx.bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
      - ${NGINX_LOG_DIR:-./runtime/nginx}:/var/log/nginx
    secrets:
      - admin_htpasswd
    networks: [frontend]
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.25

  certbot:
    image: certbot/certbot:v3.1.0
    profiles:
      - certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  tmp_data:

networks:
  frontend:
  backend:
    internal: true

secrets:
  admin_htpasswd:
    file: ${ADMIN_HTPASSWD_FILE:-./deploy/security/admin.htpasswd.example}
