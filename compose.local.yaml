services:
  api:
    env_file: !override
      - .env.local-docker
    environment:
      API_IP_RATE_LIMIT: "500"
      API_IP_RATE_WINDOW_SECONDS: "1"
      PRODUCT_IMPORT_CHUNK_SIZE: "20971520"

  worker:
    env_file: !override
      - .env.local-docker

  beat:
    env_file: !override
      - .env.local-docker

  nginx:
    build:
      args:
        WEB_VITE_PUBLIC_PATH: /admin/
        WEB_VITE_BASE_API: /api/v1
        PUBLIC_VITE_API_BASE_URL: /api/v1
    ports: !override
      - "6868:80"
    volumes: !override
      - uploads_data:/usr/share/nginx/uploads:ro
      - ./deploy/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
