services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sym}
      POSTGRES_USER: ${POSTGRES_USER:-sym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sym} -d ${POSTGRES_DB:-sym}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: app_runtime
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/opt/sym/uploads
      - tmp_data:/opt/sym/tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9999/openapi.json >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      target: app_runtime
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=INFO"]
    volumes:
      - uploads_data:/opt/sym/uploads
      - tmp_data:/opt/sym/tmp

  beat:
    build:
      context: .
      target: app_runtime
    restart: unless-stopped
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      [
        "celery",
        "-A",
        "app.core.celery_app.celery_app",
        "beat",
        "--loglevel=INFO",
        "--pidfile=/tmp/celerybeat.pid",
        "--schedule=/tmp/celerybeat-schedule"
      ]
    volumes:
      - uploads_data:/opt/sym/uploads
      - tmp_data:/opt/sym/tmp

  nginx:
    build:
      context: .
      target: nginx_runtime
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - uploads_data:/usr/share/nginx/uploads:ro

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  tmp_data:
